# =============================================================================
# Scrapicook - Docker Compose Configuration
# Production and development orchestration
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Application Service
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: scrapicook-app
    restart: unless-stopped
    ports:
      - "${PORT:-8012}:8080"
    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-scrapicook}:${POSTGRES_PASSWORD:-scrapicook}@db:5012/${POSTGRES_DB:-scrapicook}?schema=public
      # Server
      - PORT=${PORT:-8080}
      - SERVER_HOSTNAME=${SERVER_HOSTNAME:-0.0.0.0}
      - NODE_ENV=${NODE_ENV:-production}
      # Jow API
      - JOW_API_URL=${JOW_API_URL:-https://api.jow.fr}
      - JOW_BEARER=${JOW_BEARER}
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-scrapicook}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-0.0.1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scrapicook-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8012/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: scrapicook-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5012}:5012"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-scrapicook}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-scrapicook}
      - POSTGRES_DB=${POSTGRES_DB:-scrapicook}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - scrapicook-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrapicook} -d ${POSTGRES_DB:-scrapicook}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  scrapicook-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local
